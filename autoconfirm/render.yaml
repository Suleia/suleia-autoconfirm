services:
  - type: web
    name: suleia-autoconfirm
    env: docker
    dockerfilePath: ./autoconfirm/Dockerfile
    plan: starter
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8787
      - key: DROPEA_DROPSHIPPER_ID
        value: 17431
      - key: DROPEA_DASHBOARD_PROFIT
        value: 448.19
      - key: GOOGLE_SHEETS_ENABLED
        value: false
      - key: SHOPIFY_DOMAIN
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_DASHBOARD_ENABLED
        value: true
      - key: META_DASHBOARD_INTERVAL_MINUTES
        value: 720
      - key: AUTO_POLL_ENABLED
        value: true
      - key: AUTO_POLL_INTERVAL_MINUTES
        value: 5
      - key: OPERATIONAL_DASHBOARD_INTERVAL_MINUTES
        value: 15
      - key: DELAYED_CONFIRM_REAL_ENABLED
        value: true
      - key: CONFIRMATION_DELAY_HOURS
        value: 1
      - key: UNANSWERED_CANCEL_AFTER_HOURS
        value: 48
      - key: UNANSWERED_CANCELLATION_STATUSES
        value: PENDING
      - key: UNANSWERED_CANCELLATION_INTERVAL_MINUTES
        value: 60
      - key: UNANSWERED_REJECT_REAL_ENABLED
        value: true
      - key: INCIDENTS_SYNC_INTERVAL_MINUTES
        value: 480
      - key: INCIDENT_RESPONSE_TIMEOUT_HOURS
        value: 48
      - key: INCIDENT_ADDRESS_RESOLUTION_REAL_ENABLED
        value: true
      - key: INCIDENT_NOTIFICATIONS_ENABLED
        value: true
      - key: INCIDENT_NOTIFICATION_DELAY_HOURS
        value: 0
      - key: ENABLE_INCIDENT_DISCOUNT_TEMPLATE
        value: true
      - key: INCIDENT_DISCOUNT_REAL_ENABLED
        value: true
      - key: INCIDENT_DISCOUNT_INTERVAL_MINUTES
        value: 15
      - key: INCIDENT_DISCOUNT_RETURN_REAL_ENABLED
        value: true
      - key: CHATBY_INCIDENT_TEMPLATE_OWNER
        value: repository
      - key: CHATBY_LIFECYCLE_TEMPLATE_OWNER
        value: repository
      - key: PREPARED_TEMPLATE_RECOVERY_GRACE_SECONDS
        value: 120
      - key: CHATBY_TOKEN
        sync: false
      - key: WHATSAPP_PROVIDER
        value: chatby
      - key: WHATSAPP_TEMPLATE_NAME
        value: es_ES dropea_pedido_nuevo_v1
      - key: META_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: DROPEA_API_KEY
        sync: false
      - key: DROPEA_ACCESS_TOKEN
        sync: false
      - key: DROPEA_STORES_CONFIG
        sync: false
      - key: DROPEA_READ_JWT_ES
        sync: false
      - key: DROPEA_ACTIONS_STORES_CONFIG
        sync: false
      - key: DROPEA_ACTION_JWT_ES
        sync: false
  - type: cron
    name: suleia-unanswered-cancellations
    env: docker
    dockerfilePath: ./autoconfirm/Dockerfile
    dockerCommand: node tools/unanswered-cancellations.mjs
    schedule: "0 */5 * * *"
    plan: starter
    envVars:
      - key: PORT
        value: 8787
      - key: DROPEA_DROPSHIPPER_ID
        value: 17431
      - key: DROPEA_DASHBOARD_PROFIT
        value: 448.19
      - key: GOOGLE_SHEETS_ENABLED
        value: false
      - key: SHOPIFY_DOMAIN
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_DASHBOARD_ENABLED
        value: true
      - key: META_DASHBOARD_INTERVAL_MINUTES
        value: 720
      - key: AUTO_POLL_ENABLED
        value: true
      - key: AUTO_POLL_INTERVAL_MINUTES
        value: 5
      - key: OPERATIONAL_DASHBOARD_INTERVAL_MINUTES
        value: 15
      - key: DELAYED_CONFIRM_REAL_ENABLED
        value: true
      - key: CONFIRMATION_DELAY_HOURS
        value: 1
      - key: UNANSWERED_CANCEL_AFTER_HOURS
        value: 48
      - key: UNANSWERED_CANCELLATION_STATUSES
        value: PENDING
      - key: UNANSWERED_CANCELLATION_INTERVAL_MINUTES
        value: 60
      - key: UNANSWERED_REJECT_REAL_ENABLED
        value: true
      - key: INCIDENTS_SYNC_INTERVAL_MINUTES
        value: 480
      - key: INCIDENT_RESPONSE_TIMEOUT_HOURS
        value: 48
      - key: ENABLE_INCIDENT_DISCOUNT_TEMPLATE
        value: false
      - key: CHATBY_TOKEN
        sync: false
      - key: WHATSAPP_PROVIDER
        value: chatby
      - key: WHATSAPP_TEMPLATE_NAME
        value: es_ES dropea_pedido_nuevo_v1
      - key: META_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: DROPEA_API_KEY
        sync: false
      - key: DROPEA_ACCESS_TOKEN
        sync: false
      - key: DROPEA_STORES_CONFIG
        sync: false
      - key: DROPEA_READ_JWT_ES
        sync: false
      - key: DROPEA_ACTIONS_STORES_CONFIG
        sync: false
      - key: DROPEA_ACTION_JWT_ES
        sync: false
