name: suleia-operations-staging

x-safety-environment: &safety-environment
  APP_ENV: ${APP_ENV:-staging}
  RUN_MODE: ${RUN_MODE:-SIMULATION}
  SIMULATION_ONLY: ${SIMULATION_ONLY:-true}
  PRODUCTION_WRITES_ENABLED: ${PRODUCTION_WRITES_ENABLED:-false}
  ACTION_EXECUTOR_ENABLED: ${ACTION_EXECUTOR_ENABLED:-false}
  MCP_WRITE_TOOLS_ENABLED: ${MCP_WRITE_TOOLS_ENABLED:-false}
  OPENAI_API_ENABLED: ${OPENAI_API_ENABLED:-false}
  OPENAI_API_AUTOMATION_ENABLED: ${OPENAI_API_AUTOMATION_ENABLED:-false}
  OPENAI_RESPONSES_API_ENABLED: ${OPENAI_RESPONSES_API_ENABLED:-false}
  OPENAI_ASSISTANTS_API_ENABLED: ${OPENAI_ASSISTANTS_API_ENABLED:-false}
  OPENAI_CHAT_COMPLETIONS_ENABLED: ${OPENAI_CHAT_COMPLETIONS_ENABLED:-false}
  EXTERNAL_LLM_CALLS_ENABLED: ${EXTERNAL_LLM_CALLS_ENABLED:-false}
  LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-false}
  REAL_DATA_WRITE_ENABLED: ${REAL_DATA_WRITE_ENABLED:-false}
  REAL_DATA_READ_ENABLED: ${REAL_DATA_READ_ENABLED:-false}
  CONNECTOR_WRITE_ENABLED: ${CONNECTOR_WRITE_ENABLED:-false}
  CUSTOMER_MESSAGES_ENABLED: ${CUSTOMER_MESSAGES_ENABLED:-false}
  ORDER_CONFIRMATION_ENABLED: ${ORDER_CONFIRMATION_ENABLED:-false}
  ORDER_CANCELLATION_ENABLED: ${ORDER_CANCELLATION_ENABLED:-false}
  RETURN_TO_ORIGIN_ENABLED: ${RETURN_TO_ORIGIN_ENABLED:-false}
  DISCOUNTS_ENABLED: ${DISCOUNTS_ENABLED:-false}
  LIVE_WEBHOOKS_ENABLED: ${LIVE_WEBHOOKS_ENABLED:-false}
  LIVE_CRON_ENABLED: ${LIVE_CRON_ENABLED:-false}
  LIVE_POLLING_ENABLED: ${LIVE_POLLING_ENABLED:-false}
  TEST_PHONE_BLOCK_ENABLED: ${TEST_PHONE_BLOCK_ENABLED:-true}
  TEST_PHONE_NORMALIZED: ${TEST_PHONE_NORMALIZED:-}
  DUPLICATE_ORDER_DETECTION_ENABLED: ${DUPLICATE_ORDER_DETECTION_ENABLED:-true}
  DUPLICATE_ORDER_BLOCKING_ENABLED: ${DUPLICATE_ORDER_BLOCKING_ENABLED:-false}
  CHATBY_CONTACT_CLEANUP_PREVIEW_ENABLED: ${CHATBY_CONTACT_CLEANUP_PREVIEW_ENABLED:-true}
  CHATBY_CONTACT_DELETE_ENABLED: ${CHATBY_CONTACT_DELETE_ENABLED:-false}
  RELEASIT_RETURN_BLOCK_PREVIEW_ENABLED: ${RELEASIT_RETURN_BLOCK_PREVIEW_ENABLED:-true}
  RELEASIT_RETURN_BLOCK_WRITE_ENABLED: ${RELEASIT_RETURN_BLOCK_WRITE_ENABLED:-false}
  PII_MASKING_ENABLED: ${PII_MASKING_ENABLED:-true}
  AUDIT_LOGGING_ENABLED: ${AUDIT_LOGGING_ENABLED:-true}
  DETERMINISTIC_AUTO_ROUTE_CONFIDENCE: ${DETERMINISTIC_AUTO_ROUTE_CONFIDENCE:-0.95}
  AI_REVIEW_ROUTE_MIN_CONFIDENCE: ${AI_REVIEW_ROUTE_MIN_CONFIDENCE:-0.60}
  HUMAN_REVIEW_REQUIRED_RISK: ${HUMAN_REVIEW_REQUIRED_RISK:-HIGH}
  CRITICAL_ALWAYS_BLOCKED: ${CRITICAL_ALWAYS_BLOCKED:-true}

x-node-service: &node-service
  build:
    context: ../..
    dockerfile: infrastructure/docker/Dockerfile.node
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m,noexec,nosuid
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 384M
        pids: 128

services:
  reverse-proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    environment:
      OPS_STAGING_HOST: ${OPS_STAGING_HOST:-ops-staging.localhost}
      API_STAGING_HOST: ${API_STAGING_HOST:-api-staging.localhost}
      MCP_STAGING_HOST: ${MCP_STAGING_HOST:-mcp-staging.localhost}
    volumes:
      - ../reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - reverse_proxy_data:/data
      - reverse_proxy_config:/config
    networks:
      - public_network
      - application_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp-edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:-mcp.suleia.com}
      OPS_PUBLIC_HOST: ${OPS_PUBLIC_HOST:-ops-staging.localhost}
    volumes:
      - ../reverse-proxy/McpEdgeCaddyfile:/etc/caddy/Caddyfile:ro
      - mcp_edge_data:/data
      - mcp_edge_config:/config
    networks:
      - public_network
      - application_network
      - identity_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    <<: *node-service
    command: ["node", "apps/api/server.mjs"]
    environment:
      <<: *safety-environment
      PORT: 3200
      RUN_MODE: SHADOW_READ_ONLY
      OPERATIONS_DATABASE_URL: postgres://suleia_api_login:${SULEIA_API_PASSWORD}@postgres:5432/${POSTGRES_DB:-suleia_staging}
      OPERATIONS_OAUTH_ISSUER: https://${MCP_PUBLIC_HOST:-mcp.suleia.com}/auth/realms/suleia
      OPERATIONS_OAUTH_AUDIENCE: suleia-operations-center
      OPERATIONS_OAUTH_JWKS_URL: http://keycloak:8080/auth/realms/suleia/protocol/openid-connect/certs
      OPERATIONS_OAUTH_REQUIRED_ROLE: operations_reader
      OPERATIONS_OAUTH_CLIENT_ID: suleia-operations-center
      OPERATIONS_RATE_LIMIT_PER_MINUTE: 60
    networks:
      - application_network
      - database_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3200/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  mcp-server:
    <<: *node-service
    command: ["node", "packages/suleia-operations-mcp/src/transports/http.mjs"]
    environment:
      <<: *safety-environment
      NODE_ENV: production
      PORT: 3100
      READ_ONLY: "true"
      MCP_DATA_MODE: postgres
      MCP_DATABASE_URL: postgres://suleia_mcp_readonly_login:${SULEIA_MCP_READONLY_PASSWORD}@postgres:5432/${POSTGRES_DB:-suleia_staging}
      MCP_AUTH_MODE: oauth
      MCP_PUBLIC_ENDPOINT_ENABLED: "true"
      MCP_PUBLIC_BASE_URL: https://${MCP_PUBLIC_HOST:-mcp.suleia.com}
      MCP_OAUTH_ISSUER: https://${MCP_PUBLIC_HOST:-mcp.suleia.com}/auth/realms/suleia
      MCP_OAUTH_AUDIENCE: https://${MCP_PUBLIC_HOST:-mcp.suleia.com}/mcp
      MCP_OAUTH_JWKS_URL: http://keycloak:8080/auth/realms/suleia/protocol/openid-connect/certs
      MCP_OAUTH_REQUIRED_ROLE: mcp_reader
      MCP_GRANTED_SCOPES: orders:read,timelines:read,decisions:read,reviews:read,orders:simulate
      MCP_RATE_LIMIT_PER_MINUTE: 30
      MCP_REQUEST_BODY_LIMIT: 64kb
      MCP_TOOL_TIMEOUT_MS: 10000
      MCP_MAX_RESPONSE_BYTES: 51200
      MCP_AUDIT_MODE: stderr
    networks:
      - application_network
      - database_network
      - identity_network
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  decision-engine:
    <<: *node-service
    command: ["node", "services/process-runner.mjs", "decision-engine"]
    environment:
      <<: *safety-environment
      PORT: 3301
    networks:
      - application_network
      - database_network

  ingestion-worker:
    <<: *node-service
    command: ["node", "services/shadow-readonly-worker.mjs"]
    environment:
      <<: *safety-environment
      PORT: 3302
      RUN_MODE: SHADOW_READ_ONLY
      REAL_DATA_READ_ENABLED: "true"
      LIVE_POLLING_ENABLED: "true"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SHADOW_DATABASE_URL: postgres://suleia_ingestion_login:${SULEIA_INGESTION_PASSWORD}@postgres:5432/${POSTGRES_DB:-suleia_staging}
      MIGRATION_HASH_KEY: ${MIGRATION_HASH_KEY}
      SHADOW_PAGE_SIZE: ${SHADOW_PAGE_SIZE:-250}
      SHADOW_POLL_INTERVAL_MS: ${SHADOW_POLL_INTERVAL_MS:-300000}
      DROPEA_PUBLIC_API_ENABLED: ${DROPEA_PUBLIC_API_ENABLED:-false}
      DROPEA_PUBLIC_API_TOKEN: ${DROPEA_PUBLIC_API_TOKEN:-}
      DROPEA_PUBLIC_API_MARKET: ${DROPEA_PUBLIC_API_MARKET:-ES}
      DROPEA_PUBLIC_API_RATE_LIMIT: ${DROPEA_PUBLIC_API_RATE_LIMIT:-45}
      DROPEA_PUBLIC_API_MAX_PAGES: ${DROPEA_PUBLIC_API_MAX_PAGES:-200}
      DROPEA_PUBLIC_API_MAX_RECORDS: ${DROPEA_PUBLIC_API_MAX_RECORDS:-20000}
    networks:
      - public_network
      - application_network
      - database_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3302/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *node-service
    command: ["node", "services/process-runner.mjs", "scheduler"]
    environment:
      <<: *safety-environment
      PORT: 3303
    networks:
      - application_network
      - database_network

  review-panel:
    image: nginx:1.29-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=4m
    volumes:
      - ../../apps/review-panel:/usr/share/nginx/html:ro
    networks:
      - application_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suleia_staging}
      POSTGRES_USER: suleia_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - database_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suleia_admin -d ${POSTGRES_DB:-suleia_staging}"]
      interval: 10s
      timeout: 5s
      retries: 8
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M

  keycloak:
    build:
      context: ../..
      dockerfile: infrastructure/identity/Keycloak.Dockerfile
    image: suleia-keycloak:26.7.0
    restart: unless-stopped
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/suleia_identity
      KC_DB_USERNAME: suleia_keycloak
      KC_DB_PASSWORD: ${SULEIA_KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${MCP_PUBLIC_HOST:-mcp.suleia.com}/auth
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_FEATURES: resource-indicators:v1
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
    volumes:
      - ../identity/suleia-realm.json:/opt/keycloak/data/import/suleia-realm.json:ro
    networks:
      - identity_network
      - database_network
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
          pids: 256

  backup:
    image: postgres:17.5-alpine
    restart: "no"
    profiles: ["maintenance"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-suleia_staging}
      PGUSER: suleia_backup_login
      PGPASSWORD: ${SULEIA_BACKUP_PASSWORD}
    volumes:
      - ../backup:/opt/suleia/backup:ro
      - backup_data:/backups
    command: ["/bin/sh", "/opt/suleia/backup/backup.sh"]
    networks:
      - database_network
    depends_on:
      postgres:
        condition: service_healthy

  monitoring:
    image: louislam/uptime-kuma:1.23.16-alpine
    restart: unless-stopped
    volumes:
      - monitoring_data:/app/data
    networks:
      - application_network
    security_opt:
      - no-new-privileges:true

networks:
  public_network:
  application_network:
    internal: true
  database_network:
    internal: true
  identity_network:
    internal: true

volumes:
  postgres_data:
  backup_data:
  application_logs:
  reverse_proxy_data:
  reverse_proxy_config:
  mcp_edge_data:
  mcp_edge_config:
  monitoring_data:
