services:
  - type: web
    name: suleia-autoconfirm
    env: docker
    dockerfilePath: ./autoconfirm/Dockerfile
    plan: starter
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8787
      - key: FINANCE_BACKGROUND_REFRESH_ENABLED
        value: true
      - key: FINANCE_REFRESH_INTERVAL_MINUTES
        value: 60
